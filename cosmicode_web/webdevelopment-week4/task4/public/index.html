<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Application</title>
  </head>
  <style>
    body {
      margin: 0;
    }
    .header {
      background-color: #063f36;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      height: 50px;
      width: 100%;
      padding: 0 20px;
      box-sizing: border-box;
    }
    .header-links {
      display: flex;
      gap: 10px;
    }
    .header a {
      text-decoration: none;
      color: white;
    }
    .header a:hover {
      color: #068976;
      font-size: 1.2rem;
    }
    .footer {
      background-color: rgb(30, 30, 30);
      color: white;
      width: 100%;
      padding: 10px 0;
      text-align: center;
      margin-top: 50px;
      height: 60px;
      bottom: 0;
    }

    .footer p {
      padding-top: 10px;
      margin: 0;
    }
    .container {
      margin-left: 20px;
    }
    .inputs {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .message-container {
      margin: auto;
      margin-top: 50px;
      border: 1px solid #063f36;
      border-radius: 10px;
      padding: 20px;
      width: 50%;
      height: 500px;

      display: flex;
      flex-direction: column;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    input {
      width: 40%;
      margin: 10px;
      height: 30px;
      border-radius: 5px 5px 5px 5px;
      padding-left: 5px;
    }
    input:focus {
      border: 1px solid #068976;
      outline: none;
      box-shadow: 0 0 5px #068976;
    }
    .send {
      background-color: white;
      border: 1px solid #063f36;
      border-radius: 5px 5px 5px 5px;
      height: 40px;
      width: 80px;
      margin: 10px;
    }
    .send:hover {
      background-color: #063f36;
      color: white;
      cursor: pointer;
    }
    @media only screen and (max-width: 1024px) {
      .message-container {
        width: 70%;
      }
    }

    @media only screen and (max-width: 768px) {
      .message-container {
        width: 85%;
        height: 400px;
      }
      
      .inputs {
        flex-wrap: wrap;
        justify-content: center;
      }
      
      input {
        width: 100%;
        margin: 5px 0;
      }
      
      .send {
        width: 100%;
        margin: 5px 0;
      }
    }

    @media only screen and (max-width: 480px) {
      .header {
        flex-direction: column;
        height: auto;
        padding: 10px;
      }
      
      .header h2 {
        margin: 5px 0;
      }
      
      .header-links {
        margin-top: 5px;
      }
      
      .container {
        margin-left: 10px;
        margin-right: 10px;
      }
      
      .container h1 {
        font-size: 1.5rem;
        text-align: center;
      }
      
      .message-container {
        width: 95%;
        height: 350px;
        padding: 10px;
        margin-top: 20px;
      }
      
      .inputs {
        flex-direction: column;
        align-items: stretch;
      }
      
      label {
        text-align: left;
        margin-top: 5px;
      }
    }

    @media only screen and (max-width: 320px) {
      .header a {
        font-size: 0.9rem;
      }
      
      .header a:hover {
        font-size: 1rem;
      }
      
      .container h1 {
        font-size: 1.3rem;
      }
    }
  </style>
  <body>
    <div class="header">
      <h2>WeChat</h2>
      <div class="header-links">
        <a href="./index.html">Home</a>
        <a href="./about.html">About</a>
      </div>
    </div>
    <div class="container">
      <h1>WeChat (Chat Application)</h1>
      <div class="message-container">
        <div id="messages"></div>
        <div class="inputs">
            <label for="name">Name:</label>
          <input type="name" id="name" />
          <label for="message">Message:</label>
          <input type="message" id="message" />
          <button class="send" onclick="sendmessage()">Send</button>
        </div>
      </div>
    </div>
    <div class="footer">
      <center>
        <p>©2025 | Cosmicode Internship Week4</p>
      </center>
    </div>
  </body>
  <script src="./client.js"></script>
</html>
