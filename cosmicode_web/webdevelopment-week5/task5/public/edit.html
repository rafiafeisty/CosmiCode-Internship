<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>edit blog</title>
  </head>
  <style>
    body {
      margin: 0;
    }
    .header {
      height: 60px;
      width: 100%;
      background-color: rgb(8, 78, 54);
      color: white;
      display: flex;
      align-items: center;
      text-decoration: none;
    }
    .header h1 {
      margin-left: 10px;
    }
    .header .links {
      display: flex;
      color: white;
      text-decoration: none;
      margin-left: auto;
    }
    .links a {
      text-decoration: none;
      color: white;
      margin-left: 10px;
      margin-right: 10px;
    }
    .links a:hover {
      color: rgb(50, 122, 97);
    }
    .making {
      margin-top: 30px;
      margin: auto;
      width: 50%;
    }
    .form-group {
      margin-top: 30px;
    }
    input {
      width: 100%;
      border-radius: 5px;
      height: 20px;
      padding: 5px;
      border: 1px solid #ccc;
      outline: none;
    }

    input:focus {
      border-color: #03515a;
      box-shadow: 0 0 8px 2px rgba(43, 113, 120, 0.6);
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }

    textarea {
      width: 774px;
      height: 125px;
      padding-left: 7px;
    }
    .main {
      text-align: center;
      color: #03515a;
      font-size: 2rem;
    }
    .footer {
      background-color: rgb(30, 30, 30);
      color: white;
      width: 100%;
      text-align: center;
      margin-top: 250px;
      height: 90px;
      bottom: 0;
      position: absolute;
    }

    .footer p {
      padding-top: 20px;
      margin: 0;
    }
    .submit {
      color: black;
      height: 40px;
      width: 100px;
      background-color: white;
      border: 1px solid rgb(8, 78, 54);
      border-radius: 5px 5px 5px 5px;
    }
    .submit:hover {
      background-color: rgb(8, 78, 54);
      color: white;
      cursor: pointer;
    }
    #id {
      display: none;
    }
  </style>
  <body>
    <div class="container">
      <div class="header">
        <h1>Blog Home</h1>
        <div class="links">
          <a href="./index.html">Home</a>
          <a href="./made.html">Made Blog</a>
          <a href="./about.html">About</a>
        </div>
      </div>
      <h1 class="main">Edit A Blog</h1>
      <div class="making">
        <div class="form-group">
          <label for="title">Title:</label>
          <input type="text" id="title" />
        </div>
        <div class="form-group">
          <label for="content">Content:</label>
          <textarea type="text" id="content"></textarea>
        </div>
        <div id="id"></div>
        <button class="submit" onclick="editing()">Submit</button>
      </div>
      <div class="footer">
        <p>©2025 | Cosmicode Internship Week5</p>
      </div>
    </div>
  </body>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const title = document.getElementById("title");
      const content = document.getElementById("content");
      const id = document.getElementById("id");
      const titled = localStorage.getItem("edittitle");
      const contented = localStorage.getItem("content");
      const idval = localStorage.getItem("edid");
      title.value = titled;
      content.value = contented;
      id.textContent = idval;
    });
    function editing() {
      const title2 = document.getElementById("title").value;
      const content2 = document.getElementById("content").value;
      const id2 = document.getElementById("id").textContent;
      fetch(`/post/${id2}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ title: title2, content: content2 }),
      })
        .then((res) => {
          if (!res.ok) {
            alert("can't update post");
          }
          return res.json();
        })
        .then((data) => {
          alert("updated successfully");
          localStorage.removeItem("edittitle");
          localStorage.removeItem("content");
          localStorage.removeItem("edid");
          window.location.href = "./index.html";
        });
    }
  </script>
</html>
