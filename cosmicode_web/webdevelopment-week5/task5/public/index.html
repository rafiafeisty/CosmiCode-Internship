<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Home</title>
  </head>
  <style>
    body {
      margin: 0;
    }
    .header {
      height: 60px;
      width: 100%;
      background-color: rgb(8, 78, 54);
      color: white;
      display: flex;
      align-items: center;
      text-decoration: none;
    }
    .header h1 {
      margin-left: 10px;
    }
    .header .links {
      display: flex;
      color: white;
      text-decoration: none;
      margin-left: auto;
    }
    .links a {
      text-decoration: none;
      color: white;
      margin-left: 10px;
      margin-right: 10px;
    }
    .links a:hover {
      color: rgb(50, 122, 97);
    }
    .blogs {
      display: flex;
      gap: 10px;
      margin-left: 20px;
    }
    .card {
      margin-top: 20px;
      height: 200px;
      width: 250px;
      border: 1px solid rgb(8, 78, 54);
      border-radius: 10px 10px 10px 10px;
      align-items: center;
      text-align: center;
    }
    .ruler {
      height: 2px;
      background-color: rgb(8, 78, 54);
      margin-left:10px;
      margin-right:10px;
    }
    .card:hover {
      box-shadow: 5px 5px 5px 5px rgba(8, 78, 54, 0.5);
    }
    .main {
      text-align: center;
      color: rgb(5, 70, 67);
      font-size: 2rem;
    }
    .footer {
      background-color: rgb(30, 30, 30);
      color: white;
      width: 100%;
      text-align: center;
      margin-top: 250px;
      height: 90px;
      bottom: 0;
      position: absolute;
    }

    .footer p {
      padding-top: 20px;
      margin: 0;
    }
    .icon:hover{
      cursor: pointer;
    }
    .details{
      margin-top:10px;
      background-color: white;
      color:rgb(5, 70, 67);
      border:1px solid rgb(5, 70, 67);
      border-radius: 5px 5px 5px 5px;
      height:30px;
      width:70px;
      padding: 5px;
    }
    .details:hover{
      color:white;
      cursor: pointer;
      background-color: rgb(5, 70, 67);
    }
  </style>
  <body>
    <div class="container">
      <div class="header">
        <h1>Blog Home</h1>
        <div class="links">
          <a href="./index.html">Home</a>
          <a href="./made.html">Made Blog</a>
          <a href="./about.html">About</a>
        </div>
      </div>
      <h1 class="main">All Blogs</h1>
      <div class="blogs"></div>
      <div class="footer">
        <p>©2025 | Cosmicode Internship Week5</p>
      </div>
    </div>
  </body>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetchPosts();
    });

    function fetchPosts() {
      fetch("/posts")
        .then((res) => {
          if (!res.ok) {
            throw new Error("Network response was not ok");
          }
          return res.json();
        })
        .then((data) => {
          console.log("Received data:", data); 
          const blogContainer = document.querySelector(".blogs");

          if (data.length === 0) {
            blogContainer.innerHTML =
              "<p>No blogs found. Create your first blog!</p>";
            return;
          }

          blogContainer.innerHTML = "";

          data.forEach((post) => {
            const card = document.createElement("div");
            card.classList.add("card");

            const title = document.createElement("h2");
            title.textContent = post.title;

            const ruler = document.createElement("div");
            ruler.classList.add("ruler");

            const content = document.createElement("p");
            content.textContent = post.content;

            const details=document.createElement("button")
            details.classList.add("details")
            details.textContent="Details"

            details.addEventListener("click",()=>{
              localStorage.setItem("id",post.id)
              localStorage.setItem("title",post.title)
              localStorage.setItem("content",post.content)
              window.location.href="./detail.html"
            })

            const lordicon=document.createElement("lord-icon")
            lordicon.setAttribute("src","https://cdn.lordicon.com/jzinekkv.json")
            lordicon.setAttribute("trigger","hover")
            lordicon.style.width="30px"
            lordicon.style.height="30px"
            lordicon.classList.add("icon")

            lordicon.addEventListener("click",()=>{
              if(confirm("Are you sure you want to delete this blog?")){
                deletepost(post.id,card)
              }
            })

            const lordicon2=document.createElement("lord-icon")
            lordicon2.setAttribute("src","https://cdn.lordicon.com/exymduqj.json")
            lordicon2.setAttribute("trigger","hover")
            lordicon2.style.width="30px"
            lordicon2.style.height="30px"
            lordicon2.classList.add("icon")

            lordicon2.addEventListener("click",()=>{
              localStorage.setItem('edittitle',post.title)
              localStorage.setItem('content',post.content)
              localStorage.setItem("edid",post.id)
              window.location.href="edit.html"
            })

            card.appendChild(title);
            card.appendChild(ruler);
            card.appendChild(content);
            card.appendChild(lordicon)
            card.appendChild(lordicon2)
            card.appendChild(details)

            blogContainer.appendChild(card);
          });
        })
        .catch((error) => {
          console.error("Error fetching posts:", error);
          document.querySelector(".blogs").innerHTML =
            "<p>Error loading blogs. Please try again later.</p>";
        });
    }
    function deletepost(id,cardelement){
      fetch(`/post/${id}`,{
        method:"DELETE"
      }).then(res=>{
        if(!res.ok){
          alert("can't get post")
        }
        return res.json()
      }).then(data=>{
        cardelement.remove()
        alert("Deleted successfully")
      })
    }
  </script>
  <script src="https://cdn.lordicon.com/lordicon.js"></script>
</html>
