<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<style>
    body{
        margin:0
    }
    .header{
        height:50px;
        width:100%;
        display: flex;
        align-items: center;
        color:white;
        background-color:rgb(3, 78, 78);
    }
    .header h2{
        margin-left: 10px;
    }
    .header .links{
        display: flex;
        margin-left:auto;
    }
    .links a{
        text-decoration: none;
        color:white;
        margin-right:10px;
        margin-left:10px;
        padding:10px;
    }
    .links a:hover{
        color:rgb(5, 114, 114);
        background-color: white;
        border-radius: 5px 5px 5px 5px;
    }
    .main{
        color: rgb(3, 78, 78);
        font-size: 2rem;
        text-align: center;
    }
    .card{
        width:30%;
        margin:auto;
        margin-top:30px;
    }
    .form-group{
        margin-top:20px;
    }
    input{
        width:100%;
        height:30px;
        padding-left:7px;
        border-radius:5px 5px 5px 5px;
        border:1px solid rgb(3, 78, 78);
    }
    input:focus{
        outline:none;
        border:1px solid rgb(3, 78, 78);
        box-shadow: 2px 0px 2px 0px rgba(5, 114, 114,0.5);
    }
    .submit{
        height:40px;
        width:60px;
        border: 1px solid rgb(3, 78, 78);
        background-color: white;
        border-radius: 5px 5px 5px 5px;
        margin-top:20px;
    }
    .submit:hover{
        background-color: rgb(3, 78, 78);
        color:white;
        cursor: pointer;
    }
    .footer {
      background-color: rgb(30, 30, 30);
      color: white;
      width: 100%;
      text-align: center;
      margin-top: 250px;
      height: 90px;
      bottom: 0;
      position: absolute;
    }

    .footer p {
      padding-top: 20px;
      margin: 0;
    }
</style>
<body>
    <div class="container">
        <div class="header">
            <h2>Authentication</h2>
            <div class="links">
                <a href="./login.html">Login</a>
                <a href="./register.html">Register</a>
            </div>
        </div>
        <h1 class="main">Register</h1>
        <div class="card">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username">
            </div>
            <div class="form-group">
                <label for="username">Password:</label>
                <input type="password" id="password">
            </div>
            <div class="form-group">
                <label for="username">Role:</label>
                <select name="role" id="role">
                <option value="admin">Admin</option>
                <option value="user">User</option>
                </select>
            </div>
            <button class="submit" onclick="registering()">Register</button>
        </div>
        <div class="footer">
        <p>©2025 | Cosmicode Internship Week5</p>
      </div>
    </div>
</body>
<script>
    async function registering(){
        const username=document.getElementById("username").value
        const password=document.getElementById("password").value
        const role=document.getElementById("role").value

        const response=await fetch('api/auth/register',{
            method:"POST",
            headers:{
                'Content-type':'application/json'
            },
            body:JSON.stringify({username,password,role})
        })
        const data=await response.json()
        if(response.ok){
            alert("Congratulations on successful registration")
            window.location.href="./login.html"
        }

    }
</script>
</html>
