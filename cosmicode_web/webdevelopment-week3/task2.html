<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validation</title>
  </head>
  <style>
    body {
      background-color: #f0f0f0;
    }
    .form {
      width: 40%;
      margin-left: auto;
      margin-right: auto;
      margin-top: 120px;
      box-shadow: 10px 10px 10px 10px rgb(88, 107, 123);
      border-radius: 10px 10px 10px 10px;
      padding: 10px;
      height: 400px;
    }
    button {
      background-color: rgb(12, 92, 81);
      color: white;
      width: 90px;
      padding: 10px;
      margin-top: 40px;
      border: none;
    }
    button:hover {
      cursor: pointer;
      background-color: rgb(21, 113, 101);
    }
    .formgroup {
      width: 50%;
      margin-left: auto;
      margin-right: auto;
      margin-top: 10px;
    }
    input {
      width: 100%;
      height: 30px;
      border-radius: 5px 5px 5px 5px;
      padding-left:5px;
    }
    .container{
     font-style: italic;
     color: rgb(12, 92, 81);   
     margin: auto;
    }
    .container h3{
        font-size: 2rem;
    }
    .container p{
        font-size: 1.5rem;
    }
  </style>
  <body>
    <div class="form">
      <h1>Form Filling</h1>
      <form>
        <div class="formgroup">
          <label for="name">Name *</label>
          <input type="text" id="name" />
          <div id="nameerror"></div>
        </div>
        <div class="formgroup">
          <label for="email">Email *</label>
          <input type="email" id="email" />
          <div id="emailerror"></div>
        </div>
        <div class="formgroup">
          <label for="password">Password *</label>
          <input type="password" id="password" />
          <div id="passworderror"></div>
        </div>
        <center>
          <button onclick="checking()" type="submit">Submit</button>
        </center>
      </form>
      <div style="display: none;" class="container">
        <center>
        <h3>Successful Submission</h3>
        <p>Your form has been successfully saved</p>
        </center>
      </div>
    </div>
  </body>
  <script>
    function checking(){
        var nameerror=document.getElementById("nameerror").innerHTML=""
        var emailerror=document.getElementById("emailerror").innerHTML=""
        var passworderror=document.getElementById("passworderror").innerHTML=""
        event.preventDefault()
        var name = document.getElementById("name").value;
        var email=document.getElementById("email").value
        var password=document.getElementById("password").value
        isvalid=true
        if(name==""){
            error=document.getElementById("nameerror")
            error.innerHTML="Please enter your name"
            error.style.color="red"
            error.style.display="block"
            isvalid=false
        }
        if(email==""){
            error=document.getElementById("emailerror")
            error.innerHTML="Please enter your name"
            error.style.color="red"
            error.style.display="block"
            isvalid=false
        }
        pattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/
        if(!pattern.test(email)){
            error=document.getElementById("emailerror")
            error.innerHTML="Please valid email"
            error.style.color="red"
            error.style.display="block"
            isvalid=false
        }
        if(password==""){
            error=document.getElementById("passworderror")
            error.innerHTML="Please enter your password"
            error.style.color="red"
            error.style.display="block"
            isvalid=false
        }
        if(password.length<6){
            error=document.getElementById("passworderror")
            error.innerHTML="Please enter 6 character password"
            error.style.color="red"
            error.style.display="block"
            isvalid=false
        }
        if(isvalid){
            document.querySelector("form").style.display="none"
            document.querySelector(".container").style.display="block"
        }
    }
  </script>
</html>
