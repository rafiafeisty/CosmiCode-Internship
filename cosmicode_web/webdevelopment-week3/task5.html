<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Searching</title>
  </head>
  <style>
    .main-container {
      width: 100%;
    }
    .main-container h1 {
      color: rgb(9, 87, 88);
      font-size: 2.5rem;
      font-style: italic;
    }
    .input {
      align-items: center;
      margin: 30px auto;
      width: 70%;
      justify-content: center;
      color: rgb(9, 87, 88);
    }
    .input h3 {
      font-size: 1.5rem;
    }
    .formgroup {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    input {
      width: 180px;
      height: 20px;
      padding-left: 5px;
      border-radius: 5px 5px 5px 5px;
    }
    .loading {
      display: none;
      margin-top: 30px;
    }
    button {
      color: rgb(9, 87, 88);
      border: 1px solid rgb(9, 87, 88);
      background-color: white;
      border-radius: 5px 5px 5px 5px;
      padding: 5px;
      font-size: 15px;
    }
    button:hover {
      color: white;
      background-color: rgb(9, 87, 88);
      cursor: pointer;
    }
    .books {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 30px;
      gap: 20px;
    }

    .card-body {
      background: white;
      padding: 15px;
      width: 180px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .card-body:hover {
      transform: scale(1.05);
    }

    .card-body img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 5px;
    }

    .card-body h3 {
      font-size: 16px;
      margin: 10px 0 5px;
    }

    .card-body p {
      font-size: 14px;
      color: #555;
    }
   #modal {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.7);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

#modal-body {
  background: white;
  padding: 20px;
  border-radius: 10px;
  width: 80%;
  max-width: 600px;
  position: relative;
  margin: 120px auto;
}

.close {
  position: absolute;
  right: 15px;
  top: 10px;
  font-size: 22px;
  cursor: pointer;
}

  </style>
  <body>
    <div class="main-container">
      <h1>Book Searching</h1>
      <center>
        <div class="input">
          <h3>Search Book</h3>
          <div class="formgroup">
            <input class="input2" type="text" />
            <button onclick="searching()">Search</button>
          </div>
          <div class="loading">Loading...</div>
        </div>
      </center>
      <div class="books"></div>
      <div class="details"></div>
      <div id="modal">
        <div id="modal-body">
          <span class="close" onclick="closemodal()">&times;</span>
          <div id="modal-content"></div>
        </div>
      </div>
    </div>
  </body>
  <script>
    async function display() {
      const books = document.querySelector(".books");
      const loading = document.querySelector(".loading");

      books.innerHTML = "";
      loading.style.display = "block";

      try {
        const response = await fetch(
          `https://openlibrary.org/search.json?q=book`
        );
        const data = await response.json();

        if (!data.docs || data.docs.length === 0) {
          books.innerHTML = `<p>No books found</p>`;
        } else {
          data.docs.forEach((book) => {
            const title = book.title || "No title";
            const author = book.author_name
              ? book.author_name.join(", ")
              : "Author not found";
            const coverID = book.cover_i;
            const workkey = book.key;
            const img = coverID
              ? `https://covers.openlibrary.org/b/id/${coverID}-M.jpg`
              : "https://via.placeholder.com/150x250?text=No+Cover";

            const card = document.createElement("div");
            card.classList.add("card-body");
            card.setAttribute("data-work-id", workkey);
            card.innerHTML = `
          <img src="${img}" alt="book cover"/>
          <h3>${title}</h3>
          <p>${author}</p>`;
          card.addEventListener("click",()=>details(workkey))
            books.appendChild(card);
          });
        }
      } catch (error) {
        books.innerHTML = `<p>Error fetching API</p>`;
        console.error(error);
      } finally {
        loading.style.display = "none";
      }
    };

    async function searching() {
      const searchInput = document.querySelector(".input2").value;
      const books = document.querySelector(".books");
      const loading = document.querySelector(".loading");
      books.innerHTML = "";
      if (!searchInput) {
        alert("Please enter the book name");
        display()
      } else {
        loading.style.display = "block";
        try {
          const response = await fetch(
            `https://openlibrary.org/search.json?q=${encodeURIComponent(
              searchInput
            )}`
          );
          const data = await response.json();
          if (data.docs.length == 0) {
            books.innerHTML = `<p>No books found</p>`;
          } else {
            data.docs.forEach((book) => {
              const title = book.title || "no title";
              const author = book.author_name
                ? book.author_name.join(",")
                : "author not found";
              const coverID = book.cover_i;
              const workkey = book.key;
              const img = coverID
                ? `https://covers.openlibrary.org/b/id/${coverID}-M.jpg`
                : "https://via.placeholder.com/150x250?text=No+Cover";
              const card = document.createElement("div");
              card.classList.add("card-body");
              card.setAttribute("data-work-id", workkey);
              card.innerHTML = `<img src=${img} alt="book cover"/>
                    <h3>${title}</h3>
                    <p>${author}</p>`;
              card.addEventListener("click",()=>details(workkey))
              books.appendChild(card);
            });
          }
        } catch (error) {
          books.innerHTML = `<p>Error fetching API</p>`;
        } finally {
          loading.style.display = "none";
        }
      }
    }
    async function details(workkey){
      const modal=document.getElementById("modal")
      const content=document.getElementById("modal-content")
      content.innerHTML="Loading..."
      modal.style.display="block"
      try{
         const response = await fetch(`https://openlibrary.org${workkey}.json`);
        const book=await response.json()
         const title = book.title || "No Title";
        const desc = book.description
          ? typeof book.description === 'string' ? book.description : book.description.value
          : "No description available.";
        const year = book.first_publish_date || "N/A";
        const subjects = book.subjects ? book.subjects.slice(0, 10).join(', ') : "N/A";
        content.innerHTML=`
        <h2><strong>Title: </strong>${title}</h2>
        <p><strong>Description: </strong> ${desc}</p>
        <p><strong>Year Published:  </strong>${year}</p>
        <p><strong>Subjects:  </strong>${subjects}</p>`

      }
      catch(error){
        content.innerHTML="error catching the information"
      }
    }
    function closemodal(){
        document.getElementById("modal").style.display="none"
      }
      window.onload(display())
  </script>
</html>
